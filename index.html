<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shri Bazar - Online Grocery and all sales items Delivery .</title>
  <link rel="icon" type="image/png" href="/src/assets/shrilogo.jpeg" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Groceries and all sales items online from Shri Bazar.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #FFFBEB;
      font-family: 'Nunito', sans-serif;
    }
    /* Splash */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #FFFBEB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    #app-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    /* Glow ring — background removed */
    .splash-glow {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      animation: pulse 2s infinite;
    }
    /* Logo box — no background, bigger */
    .splash-icon {
      width: 200px;
      height: 200px;
      border-radius: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Brand name */
    .splash-brand {
      font-size: 26px;
      font-weight: 900;
      color: #1A1714;
      margin-bottom: 4px;
    }
    /* Tagline */
    .splash-tagline {
      font-size: 13px;
      color: #9B8E84;
      margin-bottom: 28px;
      font-weight: 700;
    }
    /* Loading dots */
    .splash-dots {
      display: flex;
      gap: 6px;
    }
    .splash-dots i {
      display: block;
      width: 8px;
      height: 8px;
      background: #E07B00;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .splash-dots i:nth-child(2) { animation-delay: 0.2s; }
    .splash-dots i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.1); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0);    opacity: 0.5; }
      50%       { transform: translateY(-8px); opacity: 1;   }
    }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="app-splash">
    <div class="splash-glow">
      <div class="splash-icon">
        <img src="/src/assets/shrilogo.jpeg" alt="Shri Bazar logo" />
      </div>
    </div>
    <div class="splash-brand">Shri Bazar</div>
    <div class="splash-tagline">All merchandise is available for purchase.</div>
    <div class="splash-dots">
      <i></i>
      <i></i>
      <i></i>
    </div>
  </div>

  <!-- React/Ionic App -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Hide splash after app loads -->
  <script>
    window.addEventListener("load", function () {
      var splash = document.getElementById("app-splash");
      setTimeout(function () {
        splash.classList.add("hide");
        setTimeout(function () { splash.remove(); }, 400);
      }, 1500);
    });
  </script>
</body>
</html>
